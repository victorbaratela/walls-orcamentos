{% extends 'base.html' %}
{% block conteudo %}
<div class='card' style='max-width:380px;margin:40px auto'>
  <h2>Entrar no Wall's</h2>
  {% if erro %}<p style='color:#e5484d'>{{ erro }}</p>{% endif %}
  <form method='post'>
    <label>Senha</label>
    <input type='password' name='senha' autofocus required>
    <button type='submit'>Entrar</button>
  </form>
</div>
{% endblock %}
