{% extends "base.html" %}
{% block conteudo %}
<div class="card">
  <h2>Novo item ou serviço</h2>
  <form method="post">
    <label>Nome</label>
    <input name="nome" placeholder="Ex.: Caixa de som 500W" required>
    <label>Categoria</label>
    <select name="categoria">
      {% for cat in categorias %}<option>{{ cat }}</option>{% endfor %}
    </select>
    <label>Preço (R$)</label>
    <input name="preco" inputmode="decimal" placeholder="150,00" required>
    <button type="submit">Salvar item</button>
  </form>
</div>
<div class="card">
  <h2>Itens e serviços</h2>
  <table>
    <tr><th>Nome</th><th>Categoria</th><th>Preço</th><th></th></tr>
    {% for i in itens %}
    <tr>
      <td>{{ i.nome }}</td>
      <td>{{ i.categoria }}</td>
      <td>R$ {{ "%.2f"|format(i.preco)|replace(".", ",") }}</td>
      <td>
        <form method="post" action="/itens/{{ i.id }}/excluir" onsubmit="return confirm('Excluir este item?')">
          <button class="excluir">Excluir</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
