{% extends 'base.html' %}
{% block conteudo %}
<div class='card'>
  <h2>Editar serviço</h2>
  <form method='post' enctype='multipart/form-data'>
    <label>Nome</label>
    <input name='nome' value='{{ item.nome }}' required>
    <label>Categoria</label>
    <select name='categoria'>
      {% for c in categorias %}
      <option value='{{ c }}'{% if item.categoria == c %} selected{% endif %}>{{ NOME_CATEGORIA.get(c, c) }}</option>
      {% endfor %}
    </select>
    <label>Preço (R$)</label>
    <input name='preco' inputmode='decimal' value='{{ '%.2f'|format(item.preco)|replace('.', ',') }}' required>

    <label>Foto</label>
    {% if item.tem_imagem %}
    <img class='foto-atual' src='/itens/{{ item.id }}/imagem?v={{ item.imagem_v }}' alt=''>
    <label style='font-weight:normal'><input type='checkbox' name='remover_imagem' style='width:auto'> Remover a foto atual</label>
    {% endif %}
    <input type='file' name='imagem' accept='image/*'>
    <p class='aviso-suave'>{% if item.tem_imagem %}Escolha uma foto nova para trocar a atual.{% else %}Você pode tirar a foto na hora ou escolher da galeria.{% endif %}</p>

    <button type='submit'>Salvar alterações</button>
    <a class='botao' style='background:#e9ebef;margin-left:8px' href='/itens'>Cancelar</a>
  </form>
</div>
{% endblock %}
