{% extends 'base.html' %}
{% block conteudo %}
<div class='card'>
  <h1>Bem-vindo ao Wall's</h1>
  <p>Sistema de orçamentos de som, iluminação e frete.</p>
  <a href='/orcamentos/novo'><button type='button'>+ Novo orçamento</button></a>
</div>
<div class='grid'>
  <div class='card'>
    <div class='numero'>{{ total_orcamentos }}</div>
    <div>Orçamentos</div>
  </div>
  <div class='card'>
    <div class='numero'>{{ total_clientes }}</div>
    <div>Clientes cadastrados</div>
  </div>
  <div class='card'>
    <div class='numero'>{{ total_itens }}</div>
    <div>Itens e serviços</div>
  </div>
</div>
{% endblock %}
